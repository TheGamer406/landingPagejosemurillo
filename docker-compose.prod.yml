services:
  app:
    image: ghcr.io/thegamer406/landingpagejosemurillo:latest
    container_name: landingpagejosemurillo-app
    restart: unless-stopped
    ports:
      - "3000:3000"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: landingpagejosemurillo-watchtower
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 landingpagejosemurillo-app
